name: Aktualizuj kalendarz

on:
  push:
    paths:
      - "update_calendar.py"
      - "config.json"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wsei-calendar-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Diagnostyka zakresu eksportu
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          import re
          urls = [
              ("forward", "https://harmonogram.krakow.ideis.pl/Plany/WydrukTokuCsv/1079?dO=10%2F01%2F2026%2000%3A00%3A00&dD=02%2F14%2F2027%2000%3A00%3A00"),
              ("reverse", "https://harmonogram.krakow.ideis.pl/Plany/WydrukTokuCsv/1079?dO=02%2F14%2F2027%2000%3A00%3A00&dD=10%2F01%2F2026%2000%3A00%3A00"),
              ("oct-forward", "https://harmonogram.krakow.ideis.pl/Plany/WydrukTokuCsv/1079?dO=10%2F01%2F2026%2000%3A00%3A00&dD=10%2F18%2F2026%2000%3A00%3A00"),
              ("oct-reverse", "https://harmonogram.krakow.ideis.pl/Plany/WydrukTokuCsv/1079?dO=10%2F18%2F2026%2000%3A00%3A00&dD=10%2F01%2F2026%2000%3A00%3A00"),
          ]
          for name, url in urls:
              raw = urlopen(url, timeout=30).read()
              text = raw.decode("cp1250", "replace")
              dates = re.findall(r"Data Zajec:\s*(\d{4}\.\d{2}\.\d{2})", text)
              print("RANGE-TEST", name, dates[:2], dates[-2:] if dates else [], "bytes", len(raw))
          PY

      - name: Pobierz plan i wygeneruj ICS
        run: python update_calendar.py

      - name: Miesięczny heartbeat
        shell: bash
        run: |
          mkdir -p .state
          date -u +'%Y-%m-01' > .state/heartbeat.txt

      - name: Zapisz zmianę, jeśli plan się zmienił
        shell: bash
        run: |
          if git diff --quiet -- docs/plan.ics .state/heartbeat.txt; then
            echo "Brak zmian w planie."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plan.ics .state/heartbeat.txt
          git commit -m "chore: aktualizacja kalendarza zajęć"
          git push
